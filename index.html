<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Carimbo do Macaco – Escavação ao vivo</title>
<style>
  :root { --red:#cc0000; --red-hi:#ff3333; --ink:rgba(0,0,0,.86); --face:#ffd000; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#000; color:#fff;
    font-family:'Courier New',Courier,monospace; -webkit-tap-highlight-color:transparent; }
  #camera,#overlay { position:absolute; inset:0; width:100%; height:100%; }
  #camera { object-fit:cover; z-index:1; }
  #overlay { z-index:5; }
  #reticle { position:absolute; top:50%; left:50%; width:50px; height:50px; z-index:6; pointer-events:none;
    border:2px dashed rgba(255,0,0,.6); border-radius:50%; transform:translate(-50%,-50%); animation:pulse 2s infinite; }
  @keyframes pulse { 50% { transform:translate(-50%,-50%) scale(1.15); border-color:#f33; } }
  @media (prefers-reduced-motion:reduce) { #reticle { animation:none; } }

  #status { position:absolute; top:calc(env(safe-area-inset-top,0px) + 12px); left:0; right:0; z-index:10;
    text-align:center; font-size:13px; text-shadow:1px 1px 3px #000; pointer-events:none; }

  #botoes { position:absolute; right:10px; z-index:12; top:50%; transform:translateY(-50%);
    display:flex; flex-direction:column; gap:12px; }
  .btn { width:64px; height:64px; border-radius:10px; border:2px solid #fff; background:var(--red); color:#fff;
    font:bold 11px 'Courier New',monospace; box-shadow:0 0 15px rgba(255,0,0,.7); cursor:pointer; padding:4px; }
  .btn:active { transform:scale(.92); background:var(--red-hi); }
  .btn.off { background:#333; box-shadow:none; }
  .btn:focus-visible { outline:3px solid var(--face); }

  #legenda { position:absolute; left:10px; right:10px; z-index:12; bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
    background:var(--ink); border:1px solid var(--red); border-radius:8px; padding:14px 16px; max-height:42vh; overflow-y:auto;
    box-shadow:0 0 20px rgba(0,0,0,.9); font-size:15px; line-height:1.5; display:none; }
  #legenda h2 { margin:0 0 6px; font-size:16px; color:var(--red-hi); }
  #legenda .tag { color:#aaa; font-size:12px; }
  #legenda .ocr { white-space:pre-wrap; margin:8px 0 0; color:#fff; border-left:3px solid var(--face); padding-left:10px; }
  #fechar { position:absolute; top:4px; right:10px; color:#f55; font-weight:bold; font-size:22px; cursor:pointer; }
</style>
</head>
<body>
<video id="camera" autoplay playsinline muted></video>
<canvas id="overlay"></canvas>
<div id="reticle"></div>
<div id="status">Iniciando câmera…</div>

<div id="botoes">
  <button class="btn" id="btnTexto" aria-label="Ler texto">LER<br>TEXTO</button>
  <button class="btn" id="btnRosto" aria-label="Alternar rostos">ROSTOS<br>ON</button>
  <button class="btn" id="btnCam" aria-label="Trocar câmera">VIRAR<br>CÂMERA</button>
</div>

<div id="legenda" role="status" aria-live="polite">
  <span id="fechar" aria-label="Fechar">×</span>
  <div id="legConteudo"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
/* ---------- Dicionário: nomes em português + escavações ---------- */
const PT = {person:'pessoa',bicycle:'bicicleta',car:'carro',motorcycle:'moto',bus:'ônibus',bottle:'garrafa',cup:'copo',
  fork:'garfo',knife:'faca',spoon:'colher',bowl:'tigela',chair:'cadeira',couch:'sofá','potted plant':'planta',bed:'cama',
  'dining table':'mesa',tv:'televisão',laptop:'notebook',mouse:'mouse',remote:'controle remoto',keyboard:'teclado',
  'cell phone':'celular',book:'livro',clock:'relógio',scissors:'tesoura',vase:'vaso',cat:'gato',dog:'cachorro',
  backpack:'mochila',umbrella:'guarda-chuva',banana:'banana',apple:'maçã',orange:'laranja',refrigerator:'geladeira',
  'wine glass':'taça',handbag:'bolsa',bird:'pássaro',sink:'pia',oven:'forno','teddy bear':'urso de pelúcia'};

const ETIM = {
  cadeira:'Do latim <em>cathedra</em>, do grego <em>kathédra</em> (“assento”: <em>kata</em> + <em>hédra</em>). Mesma raiz de “cátedra” e “catedral”: sentar é um ato de poder.',
  pessoa:'Do latim <em>persona</em>, a máscara usada no teatro. Ser pessoa é carregar um papel diante dos outros.',
  garrafa:'Provavelmente do árabe <em>gharrāfa</em> (“jarro”), que chegou ao português pela Península Ibérica.',
  copo:'Do latim <em>cuppa</em> (“taça, cuba”).',
  livro:'Do latim <em>liber</em>: a casca interna das árvores, onde antigamente se escrevia.',
  mesa:'Do latim <em>mensa</em>.',
  celular:'Do latim <em>cellula</em> (“pequena cela”). O nome vem das células de cobertura da rede de antenas.',
  relógio:'Do latim <em>horologium</em>, do grego <em>hōrológion</em>: “o que diz as horas”.',
  tesoura:'Do latim <em>tonsoria</em> (“a que tosquia”).',
  garfo:'Do latim <em>furca</em> (“forcado”).',
  colher:'Do latim <em>cochleare</em>, de <em>cochlea</em> (“caracol”): a concha virou ferramenta.',
  sofá:'Do árabe <em>ṣuffa</em> (“banco, almofada”), via línguas europeias.',
  cama:'Do latim tardio <em>cama</em> (“leito baixo”).',
  televisão:'Híbrido: grego <em>têle</em> (“longe”) + latim <em>visio</em> (“visão”).',
  notebook:'O inglês <em>notebook</em> é “caderno”. A raiz de computador, latim <em>computare</em>, é “calcular”: <em>com</em> + <em>putare</em> (“podar, pensar”).',
  carro:'Do latim <em>carrus</em>, palavra de origem céltica (gaulesa).',
  bicicleta:'Do francês <em>bicyclette</em>: <em>bi-</em> (“dois”) + grego <em>kýklos</em> (“roda, círculo”).',
  gato:'Do latim tardio <em>cattus</em>.',
  cachorro:'Origem discutida; uma hipótese liga a <em>catulus</em> (“filhote”) em latim.',
  planta:'Do latim <em>planta</em>: “broto” e também “sola do pé”.',
  mochila:'Provavelmente do basco <em>motxil</em>.',
  maçã:'Do latim <em>(mala) matiana</em>, uma variedade de maçã.',
  banana:'De línguas da África Ocidental, levada ao português por navegadores.',
  laranja:'Do árabe <em>nāranj</em>, que vem do persa <em>nārang</em> e, antes, do sânscrito.',
  ônibus:'Do latim <em>omnibus</em> (“para todos”).',
  vaso:'Do latim <em>vas</em> (“recipiente”).',
  geladeira:'De “gelo”, do latim <em>gelu</em>.',
  mouse:'Do inglês <em>mouse</em> (“camundongo”), pelo fio que lembrava um rabo.',
  tigela:'Origem incerta; palavra de uso antigo no português.'
};
const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const ETIM_N = {}; Object.keys(ETIM).forEach(k => ETIM_N[norm(k)] = k);

/* ---------- Elementos ---------- */
const video = document.getElementById('camera');
const canvas = document.getElementById('overlay');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const legenda = document.getElementById('legenda');
const legConteudo = document.getElementById('legConteudo');
let facing = 'environment', stream = null, model = null, faceDet = null;
let rostosOn = true, boxes = [], faces = [], busy = false, ocrBusy = false;
let alvoAtual = null, alvoFixoAte = 0, ocrAte = 0;

function setStatus(t){ statusEl.textContent = t; }
function mostrar(html){ legConteudo.innerHTML = html; legenda.style.display = 'block'; }
function esconder(){ legenda.style.display = 'none'; alvoAtual = null; }
document.getElementById('fechar').onclick = esconder;

/* ---------- Câmera ---------- */
async function iniciarCamera(){
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (!navigator.mediaDevices?.getUserMedia){ setStatus('Navegador sem acesso à câmera (use HTTPS).'); return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:facing }, audio:false });
    video.srcObject = stream;
    await video.play();
    setStatus(model ? 'Aponte e toque nos quadrados vermelhos.' : 'Carregando modelo de objetos…');
  } catch(e){ setStatus('Permita o acesso à câmera para continuar.'); }
}
document.getElementById('btnCam').onclick = () => { facing = facing === 'environment' ? 'user' : 'environment'; iniciarCamera(); };

/* ---------- Modelos ---------- */
async function carregarModelos(){
  try {
    model = await cocoSsd.load({ base:'lite_mobilenet_v2' });
    setStatus('Aponte e toque nos quadrados vermelhos.');
  } catch(e){ setStatus('Falha ao carregar o modelo de objetos (precisa de internet).'); }
  if ('FaceDetector' in window){
    try { faceDet = new FaceDetector({ fastMode:true, maxDetectedFaces:5 }); } catch(e){}
  }
}

/* ---------- Mapeamento vídeo → tela (object-fit: cover) ---------- */
function mapa(){
  const vw = video.videoWidth, vh = video.videoHeight, cw = innerWidth, ch = innerHeight;
  const s = Math.max(cw/vw, ch/vh);
  return { s, ox:(cw - vw*s)/2, oy:(ch - vh*s)/2 };
}
function paraTela(b){ const m = mapa(); return { x:b[0]*m.s+m.ox, y:b[1]*m.s+m.oy, w:b[2]*m.s, h:b[3]*m.s }; }

/* ---------- Laço de detecção ---------- */
async function detectar(){
  if (!busy && model && video.readyState >= 2 && video.videoWidth){
    busy = true;
    try {
      const preds = await model.detect(video, 8, 0.5);
      boxes = preds.map(p => ({ ...paraTela(p.bbox), nome:PT[p.class] || p.class, score:p.score }));
      if (rostosOn && faceDet){
        const f = await faceDet.detect(video);
        faces = f.map(r => { const b = r.boundingBox; return paraTela([b.x,b.y,b.width,b.height]); });
      } else faces = [];
      atualizarLegenda();
    } catch(e){}
    busy = false;
  }
  setTimeout(detectar, 120);
}

function desenhar(){
  canvas.width = innerWidth; canvas.height = innerHeight;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.lineWidth = 3; ctx.font = 'bold 15px "Courier New",monospace';
  boxes.forEach(b => {
    const ativo = b === alvoAtual;
    ctx.strokeStyle = ativo ? '#ff3333' : 'rgba(204,0,0,.85)';
    ctx.lineWidth = ativo ? 4 : 2;
    ctx.strokeRect(b.x, b.y, b.w, b.h);
    const t = `${b.nome} ${Math.round(b.score*100)}%`, tw = ctx.measureText(t).width + 12;
    ctx.fillStyle = '#cc0000'; ctx.fillRect(b.x, Math.max(0,b.y-24), tw, 24);
    ctx.fillStyle = '#fff'; ctx.fillText(t, b.x+6, Math.max(17,b.y-7));
  });
  faces.forEach(f => {
    ctx.strokeStyle = '#ffd000'; ctx.lineWidth = 3; ctx.strokeRect(f.x, f.y, f.w, f.h);
    ctx.fillStyle = '#ffd000'; ctx.fillRect(f.x, f.y+f.h, 62, 22);
    ctx.fillStyle = '#000'; ctx.fillText('rosto', f.x+6, f.y+f.h+16);
  });
  requestAnimationFrame(desenhar);
}

/* ---------- Legendas ---------- */
function escavacao(nome){
  const k = ETIM_N[norm(nome)];
  return k ? ETIM[k] : 'Ainda sem escavação no dicionário local para esta palavra.';
}
function htmlObjeto(b){
  return `<h2>[Escavação: ${b.nome}]</h2>${escavacao(b.nome)}<div class="tag">confiança ${Math.round(b.score*100)}%</div>`;
}
function maisPerto(){
  const cx = innerWidth/2, cy = innerHeight/2; let melhor = null, d0 = 1e9;
  boxes.forEach(b => { const d = Math.hypot(b.x+b.w/2-cx, b.y+b.h/2-cy); if (d < d0){ d0 = d; melhor = b; } });
  return melhor;
}
function atualizarLegenda(){
  const agora = Date.now();
  if (agora < ocrAte || agora < alvoFixoAte) return;       // texto lido ou toque recente ficam na tela
  const b = maisPerto();
  if (!b){ if (alvoAtual) esconder(); return; }
  if (!alvoAtual || alvoAtual.nome !== b.nome){ mostrar(htmlObjeto(b)); }
  alvoAtual = b;
}
canvas.addEventListener('pointerdown', e => {
  const hit = boxes.filter(b => e.clientX>=b.x && e.clientX<=b.x+b.w && e.clientY>=b.y && e.clientY<=b.y+b.h)
                   .sort((a,c) => a.w*a.h - c.w*c.h)[0];
  if (hit){ alvoAtual = hit; alvoFixoAte = Date.now() + 8000; ocrAte = 0; mostrar(htmlObjeto(hit)); }
});
document.getElementById('btnRosto').onclick = e => {
  rostosOn = !rostosOn; e.currentTarget.classList.toggle('off', !rostosOn);
  e.currentTarget.innerHTML = rostosOn ? 'ROSTOS<br>ON' : 'ROSTOS<br>OFF';
  if (rostosOn && !faceDet) setStatus('Este navegador não detecta rostos; “pessoa” segue funcionando.');
};

/* ---------- Leitura de texto (OCR) ---------- */
document.getElementById('btnTexto').onclick = async () => {
  if (ocrBusy || !video.videoWidth) return;
  if (!window.Tesseract){ setStatus('Leitor de texto indisponível (precisa de internet).'); return; }
  ocrBusy = true; setStatus('Lendo texto…');
  mostrar('<h2>[Lendo…]</h2>Mantenha o texto parado e bem iluminado.');
  try {
    const c = document.createElement('canvas'); c.width = video.videoWidth; c.height = video.videoHeight;
    c.getContext('2d').drawImage(video, 0, 0);
    const { data } = await Tesseract.recognize(c, 'por');
    const texto = data.text.trim();
    if (!texto){ mostrar('<h2>[Nenhum texto encontrado]</h2>Aproxime a câmera e tente de novo.'); }
    else {
      const achadas = [...new Set(texto.split(/[^\p{L}]+/u).map(norm).filter(w => ETIM_N[w]))];
      const extra = achadas.map(w => `<p><strong>${ETIM_N[w]}</strong>: ${ETIM[ETIM_N[w]]}</p>`).join('');
      const seguro = texto.replace(/[&<>]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]));
      mostrar(`<h2>[Texto no ambiente]</h2><div class="ocr">${seguro}</div>${extra}`);
    }
    ocrAte = Date.now() + 12000;
  } catch(e){ mostrar('<h2>[Erro]</h2>Não foi possível ler o texto agora.'); }
  ocrBusy = false; setStatus('Aponte e toque nos quadrados vermelhos.');
};

/* ---------- Início ---------- */
iniciarCamera(); carregarModelos(); detectar(); desenhar();
</script>
</body>
</html>
