<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Carimbo do Macaco - AR Scanner</title>
    <style>
        /* Reset e variáveis baseadas no SEMAS Scanner */
        :root {
            --bg-primary: rgba(10, 10, 15, 0.85);
            --bg-secondary: rgba(26, 26, 46, 0.9);
            --accent-green: #00ff41;
            --accent-cyan: #00ffff;
            --accent-amber: #ffb000;
            --accent-red: #cc0000;
            --text-primary: #e0e0e0;
            --text-mono: 'Courier New', Courier, monospace;
            --border-color: #333333;
            --glow-green: 0 0 10px rgba(0, 255, 65, 0.5);
            --glow-red: 0 0 15px rgba(204, 0, 0, 0.8);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
            font-family: var(--text-mono);
            color: var(--text-primary);
            touch-action: none; /* Impede scroll no mobile */
        }

        /* Câmera ao fundo */
        #camera {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            transform: scaleX(-1); /* Efeito espelho para parecer VR */
            display: none; /* Mostrado via JS */
        }

        /* HUD Principal */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Header estilo SEMAS */
        .top-bar {
            background: var(--bg-primary);
            border-bottom: 1px solid var(--accent-green);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--glow-green);
            pointer-events: auto;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--accent-green);
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: var(--glow-green);
        }

        .status-indicators {
            display: flex;
            gap: 15px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-green);
            margin-right: 5px;
            animation: pulse 1.5s infinite;
        }

        /* Área central para os nós flutuantes */
        #ar-viewport {
            flex-grow: 1;
            position: relative;
            pointer-events: none;
        }

        /* Retículo central */
        #reticle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 1px dashed var(--accent-cyan);
            border-radius: 50%;
            opacity: 0.5;
            pointer-events: none;
            animation: spin 10s linear infinite;
        }

        /* Nós de Escavação (Dados) */
        .node {
            position: absolute;
            width: 50px;
            height: 50px;
            background-color: var(--accent-red);
            border: 2px solid var(--text-primary);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: var(--glow-red);
            transition: all 0.3s ease;
            animation: float 3s ease-in-out infinite;
        }

        .node:hover, .node:active {
            transform: scale(1.1) !important;
            background-color: #ff3333;
            box-shadow: 0 0 25px rgba(255, 0, 0, 1);
        }

        .node-label {
            font-size: 10px;
            margin-top: 2px;
            color: var(--accent-amber);
        }

        /* Posições dos nós (simulando detecção no caderno) */
        #node-1 { top: 30%; left: 25%; animation-delay: 0s; }
        #node-2 { top: 65%; left: 65%; animation-delay: 0.5s; }
        #node-3 { top: 45%; left: 80%; animation-delay: 1s; }

        /* Painel de Detalhes (O "Scanner" aberto) */
        #scanner-panel {
            position: absolute;
            top: 60px;
            right: 10px;
            bottom: 10px;
            width: 350px;
            background: var(--bg-primary);
            border: 1px solid var(--accent-cyan);
            box-shadow: var(--glow-cyan);
            border-radius: 8px;
            display: none; /* Escondido por padrão */
            flex-direction: column;
            pointer-events: auto;
            backdrop-filter: blur(10px);
            z-index: 20;
            animation: slideIn 0.3s ease-out;
        }

        .panel-header {
            background: var(--bg-secondary);
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-title {
            color: var(--accent-cyan);
            font-weight: bold;
            font-size: 14px;
        }

        .close-btn {
            background: transparent;
            border: 1px solid var(--text-secondary);
            color: var(--text-secondary);
            border-radius: 4px;
            cursor: pointer;
            padding: 2px 8px;
        }

        .close-btn:hover {
            color: #ff4444;
            border-color: #ff4444;
        }

        /* Abas do Painel */
        .tabs {
            display: flex;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
        }

        .tab {
            padding: 8px 12px;
            font-size: 11px;
            color: var(--text-secondary);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
        }

        .tab.active {
            color: var(--accent-green);
            border-bottom-color: var(--accent-green);
            background: rgba(0, 255, 65, 0.05);
        }

        /* Conteúdo das Abas */
        .panel-content {
            padding: 15px;
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.4;
            flex-grow: 1;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s;
        }

        .tab-content.active {
            display: block;
        }

        /* Estilos internos do painel (tags, grids) */
        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .data-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 4px;
            border-left: 2px solid var(--accent-amber);
        }

        .data-label {
            color: var(--text-secondary);
            font-size: 10px;
            margin-bottom: 4px;
        }

        .data-value {
            color: var(--accent-green);
            font-weight: bold;
        }

        .sema-tag {
            display: inline-block;
            background: rgba(0, 255, 255, 0.1);
            color: var(--accent-cyan);
            border: 1px solid var(--accent-cyan);
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 10px;
            margin: 2px;
        }

        .sema-tag.warning {
            background: rgba(255, 176, 0, 0.1);
            color: var(--accent-amber);
            border-color: var(--accent-amber);
        }

        /* Animações */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        @keyframes slideIn {
            from { transform: translateX(50px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Instrução inicial */
        #instruction {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: var(--bg-primary);
            padding: 20px;
            border: 1px solid var(--accent-green);
            border-radius: 8px;
            box-shadow: var(--glow-green);
            z-index: 100;
            pointer-events: auto;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Câmera -->
    <video id="camera" autoplay playsinline muted></video>

    <!-- HUD Principal -->
    <div id="hud">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="logo-area">
                <span>▶</span> CARIMBO DO MACACO [AR]
            </div>
            <div class="status-indicators">
                <span><span class="status-dot"></span>CAPTURA</span>
                <span><span class="status-dot" style="background: var(--accent-amber);"></span>ENJOO</span>
                <span><span class="status-dot" style="background: #ff4444;"></span>CRISTAL</span>
            </div>
        </div>

        <!-- Viewport AR -->
        <div id="ar-viewport">
            <div id="reticle"></div>

            <!-- Nós de Interação -->
            <div class="node" id="node-1" onclick="openScanner('node-1')">
                1
                <div class="node-label">ETIMOLOGIA</div>
            </div>
            
            <div class="node" id="node-2" onclick="openScanner('node-2')">
                2
                <div class="node-label">TECNO F.</div>
            </div>
            
            <div class="node" id="node-3" onclick="openScanner('node-3')">
                3
                <div class="node-label">REVERSO</div>
            </div>
        </div>
    </div>

    <!-- Painel do Scanner -->
    <div id="scanner-panel">
        <div class="panel-header">
            <div class="panel-title" id="panel-title">ANÁLISE DE NÓ</div>
            <button class="close-btn" onclick="closeScanner()">✕</button>
        </div>
        <div class="tabs">
            <div class="tab active" onclick="switchTab('tab-semantica')">SEMÂNTICA</div>
            <div class="tab" onclick="switchTab('tab-filologia')">FILOLOGIA</div>
            <div class="tab" onclick="switchTab('tab-interacao')">INTERAÇÃO</div>
        </div>
        <div class="panel-content">
            <!-- Conteúdo Dinâmico -->
            <div id="tab-semantica" class="tab-content active"></div>
            <div id="tab-filologia" class="tab-content"></div>
            <div id="tab-interacao" class="tab-content"></div>
        </div>
    </div>

    <!-- Instrução Inicial -->
    <div id="instruction" onclick="startAR()">
        <h2>INICIAR CAPACETE VR</h2>
        <p>Toque para permitir o acesso à câmera.<br>Gire o celular para a horizontal.</p>
    </div>

    <script>
        // Variável para armazenar o vídeo
        const video = document.getElementById('camera');

        // 1. Inicialização da Câmera e AR
        function startAR() {
            const instruction = document.getElementById('instruction');
            
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                    .then(function (stream) {
                        video.srcObject = stream;
                        video.style.display = 'block';
                        instruction.style.display = 'none'; // Esconde a instrução
                        
                        // Tenta travar a tela na horizontal
                        if (screen.orientation && screen.orientation.lock) {
                            screen.orientation.lock('landscape').catch(e => console.log("Orientação não suportada"));
                        }
                    })
                    .catch(function (error) {
                        alert("Erro ao acessar a câmera: " + error.message);
                    });
            } else {
                alert("Seu navegador não suporta acesso à câmera.");
            }
        }

        // 2. Dados Epistemológicos (Baseado no SEMAS Scanner e sua conversa)
        const database = {
            'node-1': {
                title: "NÓ 1: ETIMOLOGIA CRUZADA",
                semantica: `
                    <div class="data-grid">
                        <div class="data-box">
                            <div class="data-label">PALAVRA 1</div>
                            <div class="data-value">MACACO</div>
                        </div>
                        <div class="data-box">
                            <div class="data-label">ORIGEM</div>
                            <div class="data-value">Banto (makako)</div>
                        </div>
                    </div>
                    <div class="data-grid">
                        <div class="data-box">
                            <div class="data-label">PALAVRA 2</div>
                            <div class="data-value">CARIMBO</div>
                        </div>
                        <div class="data-box">
                            <div class="data-label">ORIGEM</div>
                            <div class="data-value">Quimbundo (ka'rima)</div>
                        </div>
                    </div>
                    <p>Semas compartilhados:</p>
                    <span class="sema-tag">[+África]</span>
                    <span class="sema-tag">[+Colisão Cultural]</span>
                    <span class="sema-tag">[+Criação Lúdica]</span>
                `,
                filologia: `
                    <p><strong>Análise Morfológica:</strong></p>
                    <p>O termo "Carimbo" evoluiu de <em>kirimbu</em> (marca a ferro) para o instrumento de borracha. "Macaco" designava "besta selvagem".</p>
                    <p><strong>Confiança:</strong> 98%</p>
                    <div style="height: 5px; background: #333; margin-top: 5px;">
                        <div style="height: 100%; width: 98%; background: var(--accent-green);"></div>
                    </div>
                `,
                interacao: `
                    <p><strong>Estado do Nó:</strong> Classificado.</p>
                    <p>Este nó ancora a base do seu jogo. A etimologia serve como o "chão" físico do caderno.</p>
                `
            },
            'node-2': {
                title: "NÓ 2: TECNO FEITIÇO",
                semantica: `
                    <div class="data-grid">
                        <div class="data-box">
                            <div class="data-label">AGENTE 1</div>
                            <div class="data-value">FERRO DE SOLDA</div>
                        </div>
                        <div class="data-box">
                            <div class="data-label">AGENTE 2</div>
                            <div class="data-value">BOLDO QUEIMADO</div>
                        </div>
                    </div>
                    <p>Reação Sinérgica:</p>
                    <span class="sema-tag warning">[+Fumaça Tóxica]</span>
                    <span class="sema-tag warning">[+Modulação Corpórea]</span>
                    <span class="sema-tag">[+Interação Enativa]</span>
                `,
                filologia: `
                    <p><strong>Análise do Artefato:</strong></p>
                    <p>O ferro de solda (tecnologia) agiu sobre a matéria orgânica (boldo). O resultado não foi uma solda, mas uma emissão química que alterou o observador (enjoo).</p>
                    <p><strong>Falha Sistêmica:</strong> O feitiço afetou o feiticeiro.</p>
                `,
                interacao: `
                    <p><strong>Estado do Nó:</strong> Instável / Tóxico.</p>
                    <p>Este nó registra a intervenção do mundo real no seu corpo. A imagem do ferro desligado no chão é a prova física dessa interação.</p>
                `
            },
            'node-3': {
                title: "NÓ 3: PROMPT REVERSO",
                semantica: `
                    <div class="data-grid">
                        <div class="data-box">
                            <div class="data-label">CONCEITO 1</div>
                            <div class="data-value">CRISTALIZAÇÃO</div>
                        </div>
                        <div class="data-box">
                            <div class="data-label">CONCEITO 2</div>
                            <div class="data-value">MODULAÇÃO</div>
                        </div>
                    </div>
                    <p>Camadas Epistemológicas:</p>
                    <span class="sema-tag">[+Observador em Outro Ângulo]</span>
                    <span class="sema-tag">[+Ferramenta Curadora]</span>
                `,
                filologia: `
                    <p><strong>Análise Filosófica:</strong></p>
                    <p>Você identificou que as IAs são "cristalizadas" de forma errada por outros humanos. A sua correção vem através da narração e da observação de um ângulo que a ferramenta não vê.</p>
                `,
                interacao: `
                    <p><strong>Estado do Nó:</strong> Em Narrativa.</p>
                    <p>Este é o nó mais abstrato. Ele representa a sua própria voz guiando a interface. O código é apenas o meio; você é o narrador.</p>
                `
            }
        };

        // 3. Funções de Controle do Painel
        function openScanner(nodeId) {
            const panel = document.getElementById('scanner-panel');
            const data = database[nodeId];

            // Atualiza o título
            document.getElementById('panel-title').textContent = data.title;

            // Preenche as abas
            document.getElementById('tab-semantica').innerHTML = data.semantica;
            document.getElementById('tab-filologia').innerHTML = data.filologia;
            document.getElementById('tab-interacao').innerHTML = data.interacao;

            // Reseta as abas para a primeira
            switchTab('tab-semantica');

            // Mostra o painel
            panel.style.display = 'flex';
            
            // Efeito de piscar o nó selecionado
            const node = document.getElementById(nodeId);
            node.style.background = 'var(--accent-cyan)';
            setTimeout(() => node.style.background = 'var(--accent-red)', 300);
        }

        function closeScanner() {
            document.getElementById('scanner-panel').style.display = 'none';
        }

        function switchTab(tabId) {
            // Remove active de todas as abas e conteúdos
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

            // Adiciona active na aba clicada
            // Encontra o botão da aba baseado no conteúdo
            const content = document.getElementById(tabId);
            const tabIndex = Array.from(content.parentNode.children).indexOf(content);
            document.querySelectorAll('.tab')[tabIndex].classList.add('active');
            
            // Mostra o conteúdo
            content.classList.add('active');
        }
    </script>
</body>
</html>
